<!doctype html>
<html>
<head>
  <title>HOTEL SUNSET</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="auth">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="handleLogin()">Login</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none">

  <h2>Dashboard</h2>
  <button onclick="handleLogout()">Logout</button>

  <h3>Add Room</h3>
  <input id="roomNo" placeholder="Room">
  <input id="roomRate" placeholder="Rate">
  <button onclick="addRoomUI()">Add</button>

  <h3>Rooms</h3>
  <div id="rooms"></div>

  <h3>Check-in</h3>
  <input id="gName" placeholder="Name">
  <input id="gPhone" placeholder="Phone">
  <select id="gRoom"></select>
  <button onclick="checkin()">Check-in</button>

  <h3>Active Guests</h3>
  <div id="guests"></div>

</div>

<script src="db.js"></script>
<script src="app.js"></script>

</body>
</html>
